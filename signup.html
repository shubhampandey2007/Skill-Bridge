<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillBridge — Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="noise"></div>

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="brand">
                <span class="brand-mark">S</span>

                <span class="brand-name">
                    SkillBridge
                </span>
            </a>

            <div class="nav-actions">

                <a href="index.html" class="btn btn-ghost">
                    ← Back
                </a>

            </div>

        </div>

    </header>


    <main>

        <section class="profile-page">

            <div class="profile-page-container">

                <div class="profile-intro">

                    <div class="eyebrow">
                        CREATE ACCOUNT
                    </div>

                    <h1>
                        Start your
                        <span>SkillBridge journey.</span>
                    </h1>

                    <p>
                        Create an account to track your assessments,
                        skill gaps and improvement over time.
                    </p>

                </div>


                <form class="profile-form" id="signupForm">

                    <div class="form-group">

                        <label for="name">
                            YOUR NAME
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            EMAIL
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            PASSWORD
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-footer">

                        <button
                            type="submit"
                            class="btn btn-primary btn-large"
                        >
                            Create Account →
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <script>

        document
            .getElementById("signupForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                fetch("http://127.0.0.1:5000/signup", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })

                })

                .then(function(response) {
                    return response.json();
                })

                .then(function(data) {

                    console.log("Signup response:", data);


                    if (data.success) {

                        alert("Account created successfully!");

                        window.location.href = "profile.html";

                    } else {

                        alert(data.message);

                    }

                })

                .catch(function(error) {

                    console.error(
                        "Signup failed:",
                        error
                    );

                    alert(
                        "Could not connect to SkillSetu backend. " +
                        "Make sure Flask is running."
                    );

                });

            });

    </script>

</body>

</html>
